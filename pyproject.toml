[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cataract-eye-classification"
version = "0.1.0"
description = "Transfer-learning ensemble for cataract severity classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "tensorflow",
  "numpy",
  "pandas",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "Pillow",
  "streamlit",
  "PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]
